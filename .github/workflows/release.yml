name: Release Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tech
            asset_name: tech-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tech
            asset_name: tech-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tech.exe
            asset_name: tech-windows-x64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Release Binary
        run: cargo build --release --target ${{ matrix.target }} --bin tech

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
