site_name: TechScript Docs
site_url: https://techscript.is-a.dev/docs/
site_description: Official documentation for the TechScript 2.0 programming language.
site_author: Tcode-Motion

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

exclude_docs: |
  ai/**/*
  engineering/**/*
  CODE_OF_CONDUCT.md
  CONTRIBUTING.md
  changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/getting-started.md
    - getting-started/installation.md
  - Language:
    - language/overview.md
    - language/variables.md
    - language/types.md
    - language/operators.md
    - language/control-flow.md
    - language/functions.md
    - language/closures.md
    - language/classes.md
    - language/inheritance.md
    - language/interfaces.md
    - language/traits.md
    - language/pattern-matching.md
    - language/error-handling.md
    - language/memory.md
    - language/arrays.md
    - language/maps.md
    - language/imports-exports.md
    - language/packages.md
    - language/concurrency.md
    - language/async.md
  - Specification:
    - specification/ffi.md
    - specification/bytecode.md
    - specification/memory-model.md
  - Compiler:
    - compiler/architecture.md
    - compiler/llvm-backend.md
    - compiler/vm.md
  - Tooling:
    - tooling/cli.md
    - tooling/formatter.md
    - tooling/package-manager.md
    - tooling/test-runner.md
  - Reference:
    - reference/APIReference.md
    - reference/StdlibReference.md
  - Guides:
    - guides/ExamplesGuide.md
    - guides/BestPractices.md
  - Resources:
    - faq.md
    - ReleaseNotes.md
    - Roadmap.md
