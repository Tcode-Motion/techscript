[package]
name = "techscript_cli"
version = "2.0.0"
edition = "2021"
description = "TechScript 2.0 compiler driver — the official tsc executable"

[[bin]]
name = "tsc"
path = "src/main.rs"

[dependencies]
techscript_common = { path = "../compiler/common" }
techscript_syntax = { path = "../compiler/syntax" }
techscript_ast = { path = "../compiler/ast" }
techscript_errors = { path = "../compiler/errors" }
techscript_lexer = { path = "../compiler/lexer" }
techscript_parser = { path = "../compiler/parser" }
techscript_semantic = { path = "../compiler/semantic" }
techscript_ir = { path = "../compiler/ir" }
techscript_optimizer = { path = "../compiler/optimizer" }
techscript_bytecode = { path = "../compiler/bytecode" }
techscript_vm = { path = "../runtime/vm" }
techscript_runtime = { path = "../runtime/runtime" }
techscript_interpreter = { path = "../runtime/interpreter" }
techscript_stdlib = { path = "../stdlib" }
techscript_package_manager = { path = "../tools/package-manager" }
techscript_formatter = { path = "../tools/formatter" }
techscript_linter = { path = "../tools/linter" }
techscript_llvm_backend = { path = "../compiler/llvm_backend" }
techscript_native_runtime = { path = "../runtime/native_runtime" }
clap = { workspace = true }
clap_complete = { workspace = true }
colored = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rustyline = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true }
bincode = "1.3.3"
dirs = "6.0"
num_cpus = "1.15"
ureq = { version = "2.9" }

[build-dependencies]
winres = "0.1.12"

[features]
default = []
llvm = ["techscript_llvm_backend/llvm"]
