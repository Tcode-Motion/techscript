name: Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, Lint & Test Workspace
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-ci-

      - name: Verify code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter
        run: cargo clippy --workspace --exclude techscript_android_runtime -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --exclude techscript_android_runtime --verbose

      - name: Build release binaries
        run: cargo build --workspace --exclude techscript_android_runtime --release

      - name: Verify CLI test suite
        run: cargo test -p techscript_cli

      - name: Verify 100% of official TechScript examples (100/100)
        shell: bash
        run: bash scripts/verify_all_examples.sh

      - name: Verify AppForge companion pure TechScript files
        shell: bash
        run: |
          ./target/release/tsc run examples/appforge/techscript-appforge/src/main.txs
          ./target/release/tsc run examples/appforge/techscript-appforge/src/app.txs
          ./target/release/tsc run examples/appforge/techscript-appforge/src/navigation.txs
          ./target/release/tsc run examples/appforge/techscript-appforge/src/theme.txs
          ./target/release/tsc run examples/appforge/techscript-appforge/src/components/dock.txs
          ./target/release/tsc run examples/appforge/techscript-appforge/src/screens/home.txs

