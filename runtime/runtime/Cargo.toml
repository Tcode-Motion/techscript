[package]
name = "techscript_runtime"
version = "0.1.0"
edition = "2021"
description = "Core runtime representation (values, environment, closures, errors, and context) for TechScript 2.0"

[dependencies]
techscript_common = { path = "../../compiler/common" }
techscript_syntax = { path = "../../compiler/syntax" }
techscript_ast = { path = "../../compiler/ast" }
techscript_errors = { path = "../../compiler/errors" }
serde = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
