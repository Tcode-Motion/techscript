# Cargo.toml
[workspace]
resolver = "2"
members = [
    "compiler/common",
    "compiler/syntax",
    "compiler/ast",
    "compiler/errors",
    "compiler/lexer",
    "compiler/parser",
    "compiler/semantic",
    "compiler/module_resolver",
    "compiler/ir",
    "compiler/optimizer",
    "compiler/bytecode",
    "compiler/llvm_backend",
    "runtime/interpreter",
    "runtime/runtime",
    "runtime/builtins",
    "runtime/gc",
    "runtime/vm",
    "stdlib",
    "cli",
    "tools/lsp",
    "tools/formatter",
    "tools/linter",
    "tools/package-manager",
    "tools/packager",
    "runtime/native_runtime",
]

[workspace.dependencies]
logos = "0.16"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tower-lsp = "0.20"
rustyline = "18"
colored = "3"
toml = "1.1"
indexmap = "2"
clap_complete = "4"
